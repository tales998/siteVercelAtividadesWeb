<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
    <link rel="stylesheet" href="forms.css">
</head>
<body>
    <p style="text-align: center;">forms(formulário) é usado para coletar informações do usuário</p>
    <P style="text-align: center;">o input é usado para exibir como o formulario vai ser exposto, assim usando varios tipos, como text, radio, checkbox, submit e button</P>

   <form>
   <div>
    <label for="nome">Nome:</label><br>
    <input type="text" id="nome" name="primeiro_nome"><br>

    <label for="ultimo_nome">Último nome:</label><br>
    <input type="text" id="ultimo_nome" name="ultimo_nome"><br>

    <label for="endereco">Endereço:</label><br>
    <input type="text" id="endereco" name="endereco"><br>

    <label for="email">E-mail:</label><br>
    <input type="email" id="email" name="email"><br>

    <label for="senha">Senha:</label><br>
    <input type="password" id="senha" name="senha"><br>

    <input type="submit" id="botaoEnter" name="botao" value="Concluído">
</div>

    
      <div>
    <h3>Semestre</h3>
    <input type="radio" id="sem1" name="semestre" value="1">
    <label for="sem1">I semestre</label><br>
    <input type="radio" id="sem2" name="semestre" value="2">
    <label for="sem2">II semestre</label><br>
    <input type="radio" id="sem3" name="semestre" value="3">
    <label for="sem3">III semestre</label><br>
    <input type="radio" id="sem4" name="semestre" value="4">
    <label for="sem4">IV semestre</label><br>
    <input type="radio" id="sem5" name="semestre" value="5">
    <label for="sem5">V semestre</label><br>
    <input type="radio" id="sem6" name="semestre" value="6">
    <label for="sem6">VI semestre</label><br>
    <input type="radio" id="sem7" name="semestre" value="7">
    <label for="sem7">VII semestre</label><br>
    <input type="radio" id="sem8" name="semestre" value="8">
    <label for="sem8">VIII semestre</label><br>
</div>

      <div>
    <h3>Disciplinas</h3>
    <input type="checkbox" id="bd" name="banco_de_dados">
    <label for="bd">Banco de Dados</label><br>
    <input type="checkbox" id="bd2" name="banco_de_dados_2">
    <label for="bd2">Banco de Dados 2</label><br>
    <input type="checkbox" id="ed" name="estrutura_de_dados">
    <label for="ed">Estrutura de Dados</label><br>
    <input type="checkbox" id="web" name="desenvolvimento_web">
    <label for="web">Desenvolvimento Web</label><br>
    <input type="checkbox" id="lp1" name="lp1">
    <label for="lp1">LP1</label><br>
    <input type="checkbox" id="lp2" name="lp2">
    <label for="lp2">LP2</label><br>
    <input type="checkbox" id="calc" name="calculo">
    <label for="calc">Cálculo</label><br>
    <input type="checkbox" id="es" name="engenharia_de_software">
    <label for="es">Engenharia de Software</label><br>
</div>
    </form>
    
    


  
</body>
</html>
